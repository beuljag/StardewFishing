# 낚시터 안에서 일반 낚시대(rods.yml에 없는 낚시대)가 쓸 능력치. rods.yml의 ID를 적는다.
# 비워 두면 일반 낚시대는 낚시터 안에서도 바닐라 낚시를 한다.
# 입질 속도는 커스텀 낚시대에만 적용된다.
vanilla-rod: basic

# false면 낚시터 밖에서 물고기를 낚을 수 없다.
allow-vanilla-outside-zones: true

display:
  # TEXT_DISPLAY: 화면 옆에 세로 막대를 띄운다 (스타듀 밸리와 같은 형태)
  # ACTIONBAR: 액션바에 가로 막대로 표시한다
  mode: TEXT_DISPLAY
  # 막대의 칸 수. ACTIONBAR에서는 이 값의 2배를 쓴다.
  rows: 20
  # 아래는 TEXT_DISPLAY 전용
  scale: 0.4
  distance: 2.5
  side-offset: 1.0
  # true면 블록 너머로도 막대가 보이지만 색이 옅어질 수 있다.
  see-through: false
  # 막대 색상. 반드시 따옴표로 감싼 "#RRGGBB" 형식으로 적는다.
  colors:
    track: "#1E1E1E"      # 빈 트랙
    bar: "#00FF00"        # 막대 (물고기가 안에 있을 때)
    bar-miss: "#00B400"   # 막대 (물고기가 밖에 있을 때)
    fish: "#00FFFF"       # 물고기 (막대 안)
    fish-miss: "#FF6A00"  # 물고기 (막대 밖)

# & 색상 코드와 &#RRGGBB 를 쓸 수 있다.
messages:
  bite-title: "&c&l입질!"
  bite-subtitle: "&f지금 우클릭!"
  game-start: "&b[낚시] &f쉬프트를 누르고 있으면 막대가 올라갑니다."
  game-hint: "&e쉬프트 &f유지: 막대 올리기 &7| &f떼기: 내리기"
  game-catch: "&b[낚시] {fish}&f 를(을) 낚았습니다!"
  game-fail: "&b[낚시] &7물고기가 도망갔습니다..."
  game-cancel: "&b[낚시] &7낚시가 중단되었습니다."
  rod-break: "&b[낚시] &c낚시대가 부서졌습니다!"
  outside-zone: "&b[낚시] &c낚시터에서만 낚시할 수 있습니다."
  item-error: "&b[낚시] &c아이템 지급에 실패했습니다. 관리자에게 문의하세요."
